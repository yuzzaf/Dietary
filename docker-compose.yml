# ---------------------------------------------------------------------------
# Dietary Backend - API & PostgreSQL via Docker Compose
# (Client is hosted externally on Vercel: https://app.muhammadyuzzaf.com/)
#
#   1. cp .env.docker.example .env      # then fill in the secrets
#   2. docker compose up -d --build
# ---------------------------------------------------------------------------
name: dietary

services:
  db:
    image: postgres:16-alpine
    container_name: dietary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-Dietary}
      # Keeps passwords/emails out of the container logs
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Dietary}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [dietary]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: dietary-api:latest
    container_name: dietary-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Points at the internal service name; never exposed to the host.
      # For a TLS-enabled managed database, append ?sslmode=require here.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-Dietary}
      # Public frontend origin allowed to call this API (e.g. Vercel deployment)
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.muhammadyuzzaf.com}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # --- application secrets (passed through from root .env) -------------
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EDAMAM_APP_ID: ${EDAMAM_APP_ID:-}
      EDAMAM_APP_KEY: ${EDAMAM_APP_KEY:-}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID:-}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    volumes:
      # Docker-layer fix: server/config/config.json forces dialectOptions.ssl.require = true
      # under NODE_ENV=production. The stock postgres container serves no TLS, so node-postgres
      # aborts with "The server does not support SSL connections". This read-only mount overrides
      # the container's copy with the non-ssl version for local/internal docker db.
      - ./server/config/config.docker.json:/app/config/config.json:ro
    networks: [dietary]

volumes:
  db_data:
    name: dietary_db_data

networks:
  dietary:
    name: dietary_net
    driver: bridge
