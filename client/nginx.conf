# Serves the built React PWA and proxies API + Socket.io traffic to the
# Express container ("server") over the shared docker-compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- REST API ---------------------------------------------------------
    # "resolver" + a variable upstream makes nginx resolve "server" per request
    # (Docker's embedded DNS), so the API container may restart freely.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://server:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Socket.io (websocket upgrade + polling fallback) -----------------
    location /socket.io/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream http://server:3000;
        proxy_pass $ws_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- PWA: the service worker and manifest must never be cached --------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # --- Hashed build assets: safe to cache forever -----------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback (react-router client side routing) ------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
